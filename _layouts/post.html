---
layout: default
---
<article>
  <p class="meta">{{ page.date | date: '%-d %B %Y' }}{% if page.tags %} · {{ page.tags | join: ' · ' }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All notes</a></p>
